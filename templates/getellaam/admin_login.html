{% extends 'base.html' %}
{% block title %}Admin Login | Getellaam{% endblock %}
{% block content %}
<section class="admin-login-section inner-3d-scene"><div class="scene-orb orb-a"></div><div class="admin-login-card depth-panel floating-3d" data-aos="zoom-in"><span class="login-badge">Admin Access</span><h1>Welcome Back</h1><p>Login to manage website enquiries and applications.</p><form method="POST" class="premium-form">{% csrf_token %}<div class="form-group"><input type="text" name="username" placeholder="Username" required></div><div class="form-group"><input type="password" name="password" placeholder="Password" required></div><button type="submit" class="btn btn-primary login-btn">Login</button></form></div></section>
{% endblock %}
